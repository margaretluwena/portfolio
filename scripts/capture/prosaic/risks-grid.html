<!doctype html>
<!-- The seven risk charts in one landscape sheet, four over three, from the
     per-card stills (Margaret, 2026-11-02: "awkwardly spaced and show more"). -->
<html lang="en"><head><meta charset="utf-8" /><title>Prosaic risks</title>
<style>
  html, body { margin: 0; }
  body { width: 1128px; height: 462px; background: #F7F4EF; position: relative; overflow: hidden; }
  .grid { position: absolute; inset: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-content: start; }
  .grid img { display: block; width: 100%; height: auto; border-radius: 10px; }
  .grid img:nth-child(n+5) { grid-column: span 1; }
  .grid .r2 { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 0 12.5%; }
</style></head>
<body><div class="grid">
  <img src="../../../public/images/prosaic/risk-0.png" alt="" /><img src="../../../public/images/prosaic/risk-1.png" alt="" /><img src="../../../public/images/prosaic/risk-2.png" alt="" /><img src="../../../public/images/prosaic/risk-3.png" alt="" />
  <div class="r2"><img src="../../../public/images/prosaic/risk-4.png" alt="" /><img src="../../../public/images/prosaic/risk-5.png" alt="" /><img src="../../../public/images/prosaic/risk-6.png" alt="" /></div>
</div></body></html>
