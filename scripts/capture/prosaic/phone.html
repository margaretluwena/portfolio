<!doctype html>
<!-- The index on a phone, in a bezel (Margaret, 2026-11-02: "model this on an iphone"). -->
<html lang="en"><head><meta charset="utf-8" /><title>Prosaic phone</title>
<style>
  html, body { margin: 0; }
  body { width: 560px; height: 1000px; background: #F7F4EF; position: relative; overflow: hidden; }
  .bezel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 404px; height: 858px; border-radius: 54px; background: #0d0d0f; padding: 7px; box-sizing: border-box;
           box-shadow: 0 24px 60px rgba(11,18,21,0.22), 0 2px 6px rgba(11,18,21,0.14); }
  .screen { width: 390px; height: 844px; border-radius: 47px; overflow: hidden; background: #F7F4EF; }
  .screen img { display: block; width: 390px; height: 844px; }
</style></head>
<body><div class="bezel"><div class="screen"><img src="phone-shot.png" alt="" /></div></div></body></html>
