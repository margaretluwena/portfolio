<!doctype html>
<!-- The Mark swipe recording (2026-11-02): a row of iPhone screens from the
     Figma file, the current one centred, sliding on a few seconds apart,
     from the library to a finished share card, through the share cards'
     iterations. Recorded by scripts/capture/capture.ts with mark.config.json.
     Margaret, 2026-11-02: "see it in an iPhone mockup and have you swipe
     through the screens, especially the share cards, through the different
     iterations". -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mark swipe</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6f5f1; overflow: hidden; }
  body { font-family: -apple-system, "Inter", system-ui, sans-serif; }
  .stage { position: relative; width: 1128px; height: 700px; overflow: hidden; }
  .track { position: absolute; top: 34px; left: 0; display: flex; gap: 64px; will-change: transform;
           transition: transform 720ms cubic-bezier(0.22, 1, 0.36, 1); }
  .phone { position: relative; width: 284px; flex: none; }
  .bezel { width: 284px; height: 617px; border-radius: 40px; background: #0d0d0f; padding: 7px; box-sizing: border-box;
           box-shadow: 0 18px 50px rgba(0,0,0,0.16), 0 2px 6px rgba(0,0,0,0.12); }
  .screen { position: relative; width: 270px; height: 603px; border-radius: 34px; overflow: hidden; background: #f2f2f2; }
  .screen img.shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  /* a share style laid into the envelope screen's card slot */
  /* the envelope screen's card slot, covered, with one share style laid in
     at a readable size: the postcard's back (the lower card of its export),
     the sticky note's top note (the upper of its export) */
  /* the share screen's card slot, with one of the three styles she exported laid in whole (2026-11-02) */
  .screen .art { position: absolute; left: 20px; top: 92px; width: 230px; height: 340px; background: #f2f2f2; display: grid; place-items: center; }
  .screen .art img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }
  .label { position: absolute; left: 0; right: 0; top: 636px; text-align: center; font-size: 13px; letter-spacing: 0.01em;
           color: rgba(20,20,20,0.5); white-space: nowrap; transition: color 400ms; }
  .label b { font-weight: 500; color: rgba(20,20,20,0.82); }
  .phone[data-on="0"] { opacity: 0.55; transition: opacity 500ms; }
  .phone[data-on="1"] { opacity: 1; transition: opacity 500ms; }
</style>
</head>
<body>
<div class="stage">
  <div class="track" id="track">
    <div class="phone"><div class="bezel"><div class="screen"><img class="shot" src="screens/01-home.png" alt="" /></div></div><div class="label"><b>Home</b> the latest line</div></div>
    <div class="phone"><div class="bezel"><div class="screen"><img class="shot" src="screens/02-categories.png" alt="" /></div></div><div class="label"><b>Library</b> by category</div></div>
    <div class="phone"><div class="bezel"><div class="screen"><img class="shot" src="screens/03-books.png" alt="" /></div></div><div class="label"><b>Library</b> by book</div></div>
    <div class="phone"><div class="bezel"><div class="screen"><img class="shot" src="screens/04-note.png" alt="" /></div></div><div class="label"><b>Note</b> the line and what you thought</div></div>
    <div class="phone"><div class="bezel"><div class="screen"><img class="shot" src="screens/07-share-envelope.png" alt="" /><div class="art"><img src="screens/style-envelope.webp" alt="" /></div></div></div><div class="label"><b>Share, shipped</b> a signed letter</div></div>
    <div class="phone"><div class="bezel"><div class="screen"><img class="shot" src="screens/07-share-envelope.png" alt="" /><div class="art"><img src="screens/style-postcard.png" alt="" /></div></div></div><div class="label"><b>Share, shipped</b> a stamped postcard</div></div>
    <div class="phone"><div class="bezel"><div class="screen"><img class="shot" src="screens/07-share-envelope.png" alt="" /><div class="art"><img src="screens/style-sticky.png" alt="" /></div></div></div><div class="label"><b>Share, shipped</b> a sticky note</div></div>
  </div>
</div>
<script>
  // the active phone sits centred in the 1128 stage; one step every DWELL ms
  const STAGE = 1128, W = 284, GAP = 64, DWELL = 1500, FIRST = 1200;
  const track = document.getElementById("track");
  const phones = Array.from(track.children);
  let i = 0;
  const go = (k) => {
    phones.forEach((p, j) => p.dataset.on = j === k ? "1" : "0");
    const x = STAGE / 2 - W / 2 - k * (W + GAP);
    track.style.transform = `translateX(${x}px)`;
  };
  track.style.transition = "none"; go(0);
  requestAnimationFrame(() => { track.style.transition = ""; });
  setTimeout(function step() { i += 1; if (i >= phones.length) return; go(i); setTimeout(step, DWELL); }, FIRST);
</script>
</body>
</html>
