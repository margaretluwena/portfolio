<!doctype html>
<!-- The Atlix brand sheet, sized for the Around it strip's small 4:3 box
     (Margaret, 2026-11-02): the wordmark, the six colours as a band, and one
     headline, nothing smaller than reads at a sixth of the column. -->
<html lang="en"><head><meta charset="utf-8" /><title>Atlix brand</title>
<style>
  html, body { margin: 0; }
  body { width: 800px; height: 600px; background: #05090f; color: #eef1f6; font-family: "Inter", -apple-system, system-ui, sans-serif; position: relative; overflow: hidden; }
  .wrap { position: absolute; inset: 48px 56px; display: grid; grid-template-rows: auto 1fr auto; gap: 28px; }
  .top img { height: 72px; display: block; }
  .band { display: grid; grid-template-columns: repeat(6, 1fr); border-radius: 8px; overflow: hidden; }
  .h { font-size: 40px; line-height: 1.08; letter-spacing: -0.025em; font-weight: 600; max-width: 14ch; }
  .h span { color: #c8922a; }
</style></head>
<body><div class="wrap">
  <div class="top"><img src="../../../public/images/wordmarks/atlix.svg" alt="Atlix" /></div>
  <div class="band"><div style="background:#0d1526"></div><div style="background:#1e3054"></div><div style="background:#c8922a"></div><div style="background:#8fa4be"></div><div style="background:#dde3ed"></div><div style="background:#eef1f6"></div></div>
  <div class="h">Narrative intelligence for the people who <span>have to respond.</span></div>
</div></body></html>
