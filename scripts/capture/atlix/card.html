<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>Atlix card</title>
<style>
  html, body { margin: 0; }
  body { width: 1128px; height: 700px; background: #e9ecf1; position: relative; overflow: hidden; }
  .card { position: absolute; left: 50%; top: 50%; width: 620px; transform: translate(-50%, -50%); border-radius: 10px; overflow: hidden;

</style></head>
<body><div class="card"><img src="../../../public/images/atlix/card-close.png" alt="" /></div></body></html>
