<!doctype html>
<!-- One Atlix card, scaled down on a grey from the product's palette
     (Margaret, 2026-11-02: "scale this down and put it on a background of a
     grey that matches with this color palette"). Captured to
     public/images/atlix/card-close-framed.png. -->
<html lang="en"><head><meta charset="utf-8" /><title>Atlix card</title>
<style>
  html, body { margin: 0; }
  body { width: 1128px; height: 760px; background: #151c2a; position: relative; overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(143,164,190,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(143,164,190,0.07) 1px, transparent 1px); background-size: 40px 40px; }
  .card { position: absolute; left: 50%; top: 50%; width: 640px; transform: translate(-50%, -50%); border-radius: 10px; overflow: hidden;
          box-shadow: 0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(30,48,84,0.9); }
  .card img { display: block; width: 100%; height: auto; }
</style></head>
<body><div class="grid"></div><div class="card"><img src="../../../public/images/atlix/card-close.png" alt="" /></div></body></html>
