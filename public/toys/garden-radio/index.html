<style>

  html,body{margin:0;height:100%;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;
    background:var(--page)}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}

  canvas{display:block;touch-action:manipulation;cursor:pointer}
  /* the player: a grey track inside a white pill, with the play button sitting proud in the middle */
  #stage{position:relative}
  /* now-playing bar: sits inside the block of dirt the dancers stand on (drawn on the canvas) */
  #panel{position:absolute;left:calc(var(--pad) + 12px);right:calc(var(--pad) + 12px);top:var(--ptop);height:var(--ph);display:flex;align-items:center;justify-content:space-between;gap:12px}

  #song{font-size:17px;line-height:1.2;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #meta{margin-top:3px;font-size:12.5px;line-height:1.3;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #player button{border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink);border-radius:50%;-webkit-tap-highlight-color:transparent;transition:transform .12s,background .15s}
  #player svg{display:block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  #player svg *{vector-effect:non-scaling-stroke}
  #player .side{width:44px;height:44px}
  #player .side:hover{background:rgba(47,34,224,.08)}
  #player .side:active{transform:scale(.9)}
  /* one primary action: the only filled control on the page */
  #play{width:52px;height:52px;margin:0 2px;background:var(--ink)!important;color:#fff!important}
  #play svg{fill:currentColor;stroke:none}
  #play:hover{background:#4234f0!important;transform:scale(1.05)}
  #play:active{transform:scale(.95)}
  #play .i-pause,#play.playing .i-play{display:none}
  #play.playing .i-pause{display:block}
  #mute .i-off,#mute.muted .i-on{display:none}
  #mute.muted .i-off{display:block}
  @media(max-width:520px){#panel{left:calc(var(--pad) + 6px);right:calc(var(--pad) + 4px)}#song{font-size:15px}#player{gap:2px}#player .side{width:40px;height:40px}#play{width:46px;height:46px}}
  #shuffle.spin svg{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes hop{0%{transform:rotate(0) scale(1)}40%{transform:rotate(-14deg) scale(1.2)}100%{transform:rotate(0) scale(1)}}

<script>
// ======================================================================
//  basics
// ======================================================================
const INK='#2f22e0',INK_L='#8a84e0',CARD='#e7e7ea',HALO='rgba(196,190,255,.75)';
const COLS=24,ROWS=16,TAU=Math.PI*2;
const today=new Date(),YEAR=today.getFullYear();
const DAYS=((YEAR%4===0&&YEAR%100!==0)||YEAR%400===0)?366:365;
const DOY=Math.floor((Date.UTC(YEAR,today.getMonth(),today.getDate())-Date.UTC(YEAR,0,1))/864e5)+1;
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=(a=0,b=1)=>a+(b-a)*Math.random(),pick=a=>a[(Math.random()*a.length)|0],clamp=(v,a,b)=>v<a?a:v>b?b:v;
// each row rides its own slow wave; neighbours drift a little apart so the mounds stack unevenly
const WPH=Array.from({length:ROWS},(_,i)=>mulberry32(i*131+7)()*.25);
const SWEEP=.85,POP=.12,SETTLE=2.4;let loadT=1e9; // seconds since this song started arriving
const xDelay=x=>clamp((x-gx)/(cell*COLS),0,1)*SWEEP;                 // when the sweep reaches x
const frontX=()=>loadT>=SWEEP?1e9:gx+loadT/SWEEP*cell*COLS;          // leading end of the dirt
// a damped spring from flat (0) to the row's real curve (1): dips and bumps overshoot, bob, and settle
function settle(x){if(loadT>SWEEP+SETTLE)return 1;const t=loadT-xDelay(x);return t<=0?0:1-Math.exp(-3.1*t)*Math.cos(9.5*t)}
function rowWave(row,x){const u=x/cell;return cell*(Math.sin(u*.36+row*.55+WPH[row])*.4+Math.sin(u*.85+row*1.1+WPH[row]*2)*.12)*settle(x)}
const easeOutBack=t=>{const c=2;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

// ======================================================================
//  hand-drawn pen (Rough.js-style: jittered endpoints, bowed middles)
// ======================================================================
function makePen(g,S,rng,J){
  const j=()=>(rng()-.5)*J,X=v=>v*S;
  const pen={
    curve(pts){const P=pts.map(([x,y])=>[X(x)+j(),X(y)+j()]);g.beginPath();g.moveTo(P[0][0],P[0][1]);
      for(let i=1;i<P.length-1;i++){const mx=(P[i][0]+P[i+1][0])/2,my=(P[i][1]+P[i+1][1])/2;g.quadraticCurveTo(P[i][0],P[i][1],mx,my)}
      const L=P[P.length-1];g.lineTo(L[0],L[1]);g.stroke()},
    line(x1,y1,x2,y2){g.beginPath();g.moveTo(X(x1)+j(),X(y1)+j());g.quadraticCurveTo(X((x1+x2)/2)+j()*1.4,X((y1+y2)/2)+j()*1.4,X(x2)+j(),X(y2)+j());g.stroke()},
    poly(pts,close){g.beginPath();pts.forEach(([x,y],i)=>{const a=X(x)+j(),b=X(y)+j();i?g.lineTo(a,b):g.moveTo(a,b)});if(close)g.closePath();g.stroke()},
    circ(cx,cy,r,ry=r,a0=-Math.PI/2,span=TAU,n=13){const full=span>=TAU-.01,pts=[];const sp=full?span+.35:span;
      for(let i=0;i<=n;i++){const a=a0+sp*i/n,w=1+(rng()-.5)*.07;pts.push([cx+Math.cos(a)*r*w,cy+Math.sin(a)*ry*w])}pen.curve(pts)},
    dot(x,y,r=.024){g.beginPath();g.arc(X(x)+j()*.4,X(y)+j()*.4,Math.max(1,r*S),0,TAU);g.fill()},
  };
  return pen;
}
const leafAt=(p,x,y,s=1,flip=1)=>p.curve([[x,y],[x+.1*s*flip,y-.08*s],[x+.18*s*flip,y-.02*s],[x+.08*s*flip,y+.03*s],[x,y]]);
// ======================================================================
//  doodle library (unit coords, centre 0,0, ±0.42)
// ======================================================================
const D={
  apple:p=>{p.curve([[0,-.14],[-.12,-.2],[-.27,-.1],[-.27,.14],[-.12,.32],[0,.28],[.12,.32],[.27,.14],[.27,-.1],[.12,-.2],[0,-.14]]);p.line(0,-.14,.03,-.3);leafAt(p,.03,-.25)},
  orange:p=>{p.circ(0,.07,.28);p.dot(-.1,.02);p.dot(.07,.15);p.dot(.12,-.04);p.dot(-.03,.22);leafAt(p,0,-.21,1,-1)},
  lemon:p=>{p.circ(0,.05,.31,.2,Math.PI,TAU);p.line(-.31,.05,-.4,.03);p.line(.31,.05,.4,.07);leafAt(p,0,-.15)},
  pineapple:p=>{p.circ(0,.15,.19,.25);p.line(-.14,.0,.12,.36);p.line(-.18,.16,0,.38);p.line(-.04,-.08,.18,.2);p.line(.14,.0,-.12,.36);p.line(.18,.16,0,.38);p.line(.04,-.08,-.18,.2);
    p.poly([[-.12,-.09],[-.2,-.3],[-.06,-.15],[0,-.42],[.06,-.15],[.2,-.3],[.12,-.09]])},
  pear:p=>{p.curve([[0,-.22],[-.1,-.17],[-.1,-.02],[-.25,.14],[-.18,.35],[0,.38],[.18,.35],[.25,.14],[.1,-.02],[.1,-.17],[0,-.22]]);p.line(0,-.22,.04,-.34);leafAt(p,.03,-.29)},
  strawberry:p=>{p.curve([[0,-.18],[-.2,-.2],[-.27,-.02],[-.14,.22],[0,.38],[.14,.22],[.27,-.02],[.2,-.2],[0,-.18]]);
    [[-.12,-.04],[0,-.06],[.12,-.04],[-.06,.08],[.06,.08],[0,.2],[-.13,.12],[.13,.12]].forEach(([x,y])=>p.dot(x,y,.018));
    p.poly([[-.17,-.19],[-.07,-.25],[0,-.33],[.07,-.25],[.17,-.19]])},
  grapes:p=>{[[-.13,-.1],[0,-.11],[.13,-.1],[-.07,.05],[.07,.05],[-.13,.19],[.13,.19],[0,.2],[0,.33]].forEach(([x,y])=>p.circ(x,y,.075,.075,-1.5,TAU,8));p.line(0,-.19,.02,-.34);leafAt(p,.02,-.28)},
  cherries:p=>{p.circ(-.15,.22,.12);p.circ(.15,.26,.12);p.curve([[-.15,.1],[-.1,-.12],[.04,-.32]]);p.curve([[.15,.14],[.12,-.1],[.04,-.32]]);leafAt(p,.04,-.32)},
  banana:p=>{p.curve([[-.32,-.14],[-.22,.16],[.1,.27],[.36,.06]]);p.curve([[-.32,-.14],[-.12,.05],[.12,.1],[.36,.06]]);p.line(-.32,-.14,-.37,-.22)},
  watermelon:p=>{p.curve([[-.36,-.02],[-.26,.22],[0,.3],[.26,.22],[.36,-.02]]);p.line(-.36,-.02,.36,-.02);p.curve([[-.28,0],[-.18,.16],[0,.22],[.18,.16],[.28,0]]);[[-.12,.07],[0,.11],[.12,.07]].forEach(([x,y])=>p.dot(x,y))},
  peach:p=>{p.circ(0,.08,.27);p.curve([[0,-.17],[-.07,.06],[0,.33]]);leafAt(p,0,-.2)},
  plum:p=>{p.circ(0,.07,.21,.27);p.line(0,-.2,.03,-.32);p.curve([[.08,-.05],[.12,.08],[.08,.2]])},
  pumpkin:p=>{p.circ(0,.1,.3,.22);p.curve([[-.06,-.11],[-.17,.1],[-.06,.31]]);p.curve([[.06,-.11],[.17,.1],[.06,.31]]);p.poly([[-.03,-.11],[-.02,-.24],[.06,-.27],[.04,-.11]])},
  daisy:p=>{p.curve([[0,.42],[.04,.2],[0,-.02]]);leafAt(p,.02,.24);for(let i=0;i<7;i++){const a=i/7*TAU;p.circ(Math.cos(a)*.14,-.14+Math.sin(a)*.14,.06,.06,-1.5,TAU,8)}p.circ(0,-.14,.05,.05,-1.5,TAU,8)},
  tulip:p=>{p.poly([[-.14,-.28],[-.15,-.07],[0,.04],[.15,-.07],[.14,-.28],[.07,-.17],[0,-.3],[-.07,-.17],[-.14,-.28]]);p.line(0,.04,0,.42);p.curve([[0,.33],[-.15,.2],[-.2,.05]])},
  spiral:p=>{const pts=[];for(let i=0;i<=26;i++){const t=i/26,r=.19*t,a=t*TAU*2.2;pts.push([Math.cos(a)*r,-.12+Math.sin(a)*r])}p.curve(pts);p.curve([[.18,-.06],[.06,.14],[0,.42]]);leafAt(p,.02,.28,1,-1);leafAt(p,.03,.2)},
  sunflower:p=>{p.circ(0,-.12,.1);for(let i=0;i<11;i++){const a=i/11*TAU;p.line(Math.cos(a)*.13,-.12+Math.sin(a)*.13,Math.cos(a)*.24,-.12+Math.sin(a)*.24)}p.line(0,0,0,.42);leafAt(p,0,.25)},
  lolli:p=>{p.circ(0,-.15,.16);p.dot(-.05,-.18);p.dot(.06,-.1);p.dot(.03,-.22);p.dot(-.06,-.06);p.line(0,.01,0,.42);leafAt(p,0,.3,1,-1);leafAt(p,0,.2)},
  sprout:p=>{p.curve([[0,.4],[.02,.18],[0,0]]);p.curve([[0,.02],[-.16,-.08],[-.25,.03],[-.1,.08],[0,.02]]);p.curve([[0,.0],[.14,-.14],[.25,-.07],[.12,.03],[0,.0]])},
  grass:p=>{[[-.22,-.05,.7],[-.11,-.1,1],[0,.04,1.1],[.11,.08,.9],[.22,.1,.7]].forEach(([x,dx,h])=>p.curve([[x,.4],[x+dx*.5,.1],[x+dx,.4-.6*h]]))},
  leaf:p=>{p.curve([[-.3,.3],[-.24,-.08],[.26,-.32],[.16,.1],[-.3,.3]]);p.line(-.3,.3,.2,-.24);p.line(-.08,.1,-.06,-.04);p.line(.06,-.02,.1,-.14)},
  tree:p=>{p.curve([[-.06,.06],[-.26,.04],[-.3,-.12],[-.18,-.3],[0,-.38],[.2,-.3],[.3,-.12],[.24,.04],[.06,.06]]);p.line(-.05,.04,-.06,.4);p.line(.05,.04,.07,.4);p.line(0,.16,.12,.04)},
  cactus:p=>{p.curve([[-.08,.4],[-.09,-.26],[0,-.35],[.09,-.26],[.08,.4]]);p.curve([[-.09,.08],[-.22,.06],[-.22,-.12]]);p.curve([[.09,0],[.22,-.02],[.22,-.2]]);p.line(-.24,.4,.24,.4)},
  mushroom:p=>{p.curve([[-.3,.0],[-.24,-.22],[0,-.3],[.24,-.22],[.3,0],[-.3,0]]);p.poly([[-.08,0],[-.1,.36],[.1,.36],[.08,0]]);p.circ(-.12,-.13,.04,.04,-1.5,TAU,7);p.circ(.1,-.17,.05,.05,-1.5,TAU,7)},
  snail:p=>{const pts=[];for(let i=0;i<=24;i++){const t=1-i/24,r=.2*t+.01,a=t*TAU*2;pts.push([.06+Math.cos(a)*r,-.02+Math.sin(a)*r])}p.curve(pts);p.curve([[-.36,.24],[-.1,.25],[.28,.24],[.36,.16]]);p.curve([[-.3,.24],[-.33,.06],[-.27,.0]]);p.line(-.3,.02,-.36,-.12);p.line(-.27,.02,-.24,-.12)},
  bee:p=>{p.circ(0,.05,.22,.15);p.line(-.06,-.08,-.07,.18);p.line(.06,-.09,.06,.18);p.circ(-.06,-.18,.08,.1);p.circ(.08,-.18,.08,.1);p.line(-.22,.05,-.3,.06);p.dot(.14,.01)},
  ladybug:p=>{p.circ(0,.07,.24,.21);p.line(0,-.13,0,.27);p.circ(0,-.16,.08,.06,Math.PI,Math.PI);[[-.1,.02],[.11,.04],[-.12,.16],[.1,.17]].forEach(([x,y])=>p.dot(x,y,.03));p.line(-.04,-.2,-.09,-.3);p.line(.04,-.2,.09,-.3)},
  bird:p=>{p.circ(0,.02,.2,.17);p.poly([[.18,-.05],[.31,-.01],[.18,.04]]);p.dot(.09,-.04);p.poly([[-.19,0],[-.34,-.1],[-.3,.06]]);p.line(-.03,.18,-.05,.32);p.line(.04,.18,.05,.32);p.curve([[-.12,.02],[-.02,.1],[.08,.04]])},
  cloud:p=>{p.curve([[-.3,.04],[-.33,-.1],[-.18,-.16],[-.08,-.3],[.12,-.24],[.22,-.13],[.33,-.05],[.28,.05],[-.3,.04]]);[[-.16,.14],[0,.16],[.16,.13]].forEach(([x,y])=>p.line(x,y,x-.04,y+.14))},
  sun:p=>{p.circ(0,0,.15);for(let i=0;i<8;i++){const a=i/8*TAU;p.line(Math.cos(a)*.21,Math.sin(a)*.21,Math.cos(a)*.33,Math.sin(a)*.33)}},
  snowflake:p=>{for(let i=0;i<3;i++){const a=i/3*Math.PI+.3,c=Math.cos(a)*.33,s=Math.sin(a)*.33;p.line(-c,-s,c,s);for(const k of[1,-1]){const ex=c*k*.7,ey=s*k*.7;p.line(ex,ey,ex+Math.cos(a+k*2.4)*.0+Math.cos(a+2.5)*.09*k,ey+Math.sin(a+2.5)*.09*k)}}},
  twig:p=>{p.curve([[0,.42],[-.03,.1],[.04,-.15],[0,-.38]]);p.line(-.02,.1,-.2,-.06);p.line(.03,-.05,.2,-.2);p.line(-.18,-.04,-.24,-.16);p.dot(0,-.38,.03)},
};
const FRUIT={apple:'bell',orange:'bass',lemon:'pluckHi',pineapple:'marimba',pear:'kalimba',strawberry:'pluck',grapes:'glass',cherries:'kalimba',banana:'marimba',watermelon:'bell',peach:'whistle',plum:'tom',pumpkin:'bass'};
const VOICE={daisy:'kalimba',tulip:'kalimba',spiral:'glass',sunflower:'bell',lolli:'kalimba',sprout:'glass',grass:'glass',leaf:'glass',tree:'glass',cactus:'pluck',mushroom:'marimba',snail:'chirp',bee:'chirp',ladybug:'chirp',bird:'chirp',cloud:'bell',sun:'bell',snowflake:'bell',twig:'glass'};
const voiceOf=t=>FRUIT[t]||VOICE[t];

// songs: a seeded garden-score with a title; saved in the browser
const ADJ=['peach','lemon','plum','berry','melon','cherry','orchard','honey','clover','petal','pear','bumble'];

let song=0,title='',growQ=[],growAcc=0;
const KEY='garden-radio-v2';

function newSong(s){
  if(!REDUCE)loadT=0;

  flyers.forEach(f=>f.done=true);drops=[];
  for(const c of cells){

function persist(){

}
function restore(){
  try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s||!s.cells||s.cells.length!==NCELLS)return false;
    song=s.song;title=titleFor(song);growQ=[];
    s.cells.forEach(([st,seed,aw,type],i)=>{const c=cells[i];c.seed=seed;c.type=D[type]?type:'sprout';c.state='dot';c.awake=false;c.final=null;

}

const sing=(type,t,m,v=1)=>V[voiceOf(type)](t,m,v);

function pauseAudio(){playing=false;AC&&AC.suspend();syncPlayer()}

let dancers=[],parts=[];
const STY=['hop','stomp','sway','kick','twist'];
const cx=c=>gx+(c.col+.5+c.dx)*cell,cy=c=>gy+(c.row+.5+c.dy)*cell+rowWave(c.row,gx+(c.col+.5)*cell);
function ticks(x,y,n,r,col=INK){for(let k=0;k<n;k++){const a=k/n*TAU+rnd(-.3,.3);parts.push({x,y,a,r,col:k%2?col:INK,life:.35,max:.35})}}

  const d={type:c.type,frames:getFrames(c),wash:getWash(c),mask:getMask(c),x:cx(c),y:cy(c),vy:-cell*9,vx:rnd(-1,1)*cell*2,state:'fall',legT:0,t:0,accent:0,jz:0,vz:0,

  bee.t-=dt;

  if(bee.state==='fly'){
    const tx=cx(bee.target),ty=cy(bee.target)-cell*.35,dx=tx-bee.x,dy=ty-bee.y,dist=Math.hypot(dx,dy),sp=cell*3.2;

const ACT={

  flower(c){c.spin=1;spray(cx(c),cy(c)-cell*.12,COL[c.type][0],7);[0,2,4].forEach((u,k)=>later(k*90,()=>{c.hit=1;if(AC)sing(c.type,AC.currentTime,penta(c.row,u),.9)}))},
  mushroom(c){c.bounce=1;spray(cx(c),cy(c)-cell*.2,['#ff8a8a','#c7b8ff','#ffd0e0'],8,'dot',.6);if(AC)V.boing(AC.currentTime,penta(c.row,2))},
  tree(c){c.wig=1;spray(cx(c),cy(c),['#8fd17a','#ffcf6b','#9fd88a'],4,'petal',.5);[0,4].forEach((u,k)=>later(k*70,()=>{c.hit=1;if(AC)V.glass(AC.currentTime,penta(c.row,u),1)}))},
  sprout(c){const f=pick(FLOWERS);c.type=f;resetCell(c);c.growT=0;c.awake=true;ticks(cx(c),cy(c),8,cell*.6,COL[f][0]);later(260,()=>playCell(c,1))},
  rustle(c){c.wig=1;spray(cx(c),cy(c),COL[c.type][0],4,'petal',.6);if(AC)V.shaker(AC.currentTime);playCell(c,.6)},
  cactus(c){c.wig=1;ticks(cx(c),cy(c),8,cell*.55,'#ff9ec8');if(AC)V.pluck(AC.currentTime,penta(c.row)+12,1)},
};
const actionFor=t=>ACT[t]||(FLOWERS.includes(t)?ACT.flower:['grass','leaf','twig'].includes(t)?ACT.rustle:null);

// ======================================================================
//  input: tap to play, hold to hush
// ======================================================================
const playBtn=document.getElementById('play'),muteBtn=document.getElementById('mute'),shufBtn=document.getElementById('shuffle'),nowEl=document.getElementById('now');
let muted=false;
// every control always shows the state it is in, and says so to screen readers
const songEl=document.getElementById('song'),metaEl=document.getElementById('meta');
function syncMeta(){const n=cells.filter(c=>c.state==='grown'&&c.awake).length,t=n===1?'1 doodle singing':n+' doodles singing';if(metaEl.textContent!==t)metaEl.textContent=t}
setInterval(syncMeta,400);
function syncPlayer(){
  playBtn.classList.toggle('playing',playing);playBtn.setAttribute('aria-label',playing?'Pause':'Play');playBtn.title=playing?'Pause (space)':'Play (space)';
  muteBtn.classList.toggle('muted',muted);muteBtn.setAttribute('aria-pressed',String(muted));muteBtn.setAttribute('aria-label',muted?'Unmute':'Mute');muteBtn.title=muted?'Unmute (M)':'Mute (M)';
  document.title=(playing?'▶ ':'')+title+' · Garden Radio';songEl.textContent=title;syncMeta();
}
function announce(){nowEl.textContent=(playing?'Now playing ':'Ready: ')+title;syncPlayer()}
// mute silences the output but the song keeps its place; pause stops the clock
function setMuted(m){muted=m;if(master)master.gain.setTargetAtTime(m?0:.85,AC.currentTime,.03);syncPlayer()}
playBtn.onclick=()=>{playing?pauseAudio():startAudio();announce()};
muteBtn.onclick=()=>setMuted(!muted);
shufBtn.onclick=()=>{newSong((Math.random()*1e6)|0);announce();shufBtn.classList.remove('spin');void shufBtn.offsetWidth;shufBtn.classList.add('spin')};
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.code==='Space'&&!e.target.closest('button,a')){e.preventDefault();playBtn.click()}
  else if(e.key==='m'||e.key==='M')muteBtn.click();
  else if(e.key==='s'||e.key==='S')shufBtn.click();
});
function cellAt(x,y){const col=Math.floor((x-gx)/cell),r0=clamp(Math.floor((y-gy)/cell),0,ROWS-1),row=Math.floor((y-gy-rowWave(r0,x))/cell);return col<0||col>=COLS||row<0||row>=ROWS?null:cells[row*COLS+col]}
let press=null,hoverCell=null;
cv.addEventListener('pointermove',e=>{hoverCell=e.pointerType==='mouse'?cellAt(e.offsetX,e.offsetY):null});
cv.addEventListener('pointerleave',()=>{hoverCell=null});
cv.addEventListener('pointerdown',e=>{if(!started)startAudio();press={x:e.offsetX,y:e.offsetY};press.timer=setTimeout(()=>{if(press){hush(press.x,press.y);press.done=true}},450)});
cv.addEventListener('pointerup',()=>{if(!press)return;clearTimeout(press.timer);if(!press.done)tap(press.x,press.y);press=null});
cv.addEventListener('pointerleave',()=>{if(press){clearTimeout(press.timer);press=null}});
function hush(x,y){const c=cellAt(x,y);if(c&&c.state==='grown'&&c.awake){c.awake=false;c.wig=1;ticks(cx(c),cy(c),4,cell*.4,INK_L);persist()}}
function tap(x,y){
  for(const d of [...dancers].reverse()){if(d.state==='dance'&&Math.hypot(x-d.x,y-(d.bodyY||0))<cell*.9){d.vz=cell*7;d.accent=1;d.style=pick(STY.filter(s=>s!==d.style));if(AC)sing(d.type,AC.currentTime,d.note+12,1);ticks(d.x,d.bodyY,6,cell*.7,COL[d.type][0]);return}}
  for(const f of flyers){if(Math.hypot(x-f.x,y-f.y)<cell*.7){f.targets.unshift({x:rnd(gx,cardW-gx),y:gy+rnd(0,gridH*.8)});f.pause=0;if(AC)V.chirp(AC.currentTime,79,1);return}}
  const c=cellAt(x,y);if(!c||c.away)return;
  if(c.state==='dot'){c.seed=(Math.random()*1e9)|0;assignType(c);resetCell(c);c.state='grown';c.growT=0;c.awake=true;later(220,()=>playCell(c,1));persist();return}
  if(c.state==='stub'){c.seed=(Math.random()*1e9)|0;assignType(c);resetCell(c);c.state='grown';c.growT=0;c.awake=false;persist();return}
  if(c.growT<1)return;
  if(FRUIT[c.type]){if(!c.awake){c.awake=true;c.bounce=1;playCell(c,1);ticks(cx(c),cy(c),6,cell*.55,COL[c.type][0])}else pluck(c);persist();return}
  const act=actionFor(c.type);c.awake=true;if(act)act(c);else playCell(c,1);persist();
}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const oW=cardW;layout();const k=cardW/oW;dancers.forEach(d=>{d.x*=k;d.y=groundY});},120)});
setInterval(()=>{if(innerWidth>0&&Math.abs(targetW()-cardW)>4){const oW=cardW;layout();dancers.forEach(d=>{d.x*=cardW/oW;d.y=groundY})}},500);

// ======================================================================
//  draw
// ======================================================================
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawDancer(d,B,boil){
  const b=B,bt=((b%1)+1)%1,bi=Math.floor(b),sn=Math.sin(Math.PI*bt),sw=Math.sin(Math.PI*b);
  const R=cell*.75,L=cell*.6*d.legT;
  let lift=0,sx=0,lf=[-.25,0],rf=[.25,0],lh=[-1.25,.1],rh=[1.25,.1];
  if(d.state==='dance')switch(d.style){
    case'hop':lift=sn*.35;lf[1]=rf[1]=sn*.2;lh=[-1.1,-.9-sn*.3];rh=[1.1,-.9-sn*.3];break;
    case'stomp':{const l=bi%2===0;lift=sn*.12;(l?lf:rf)[1]=sn*.35;lh=[-1.2,l?-.6*sn:.1];rh=[1.2,l?.1:-.6*sn];break}
    case'sway':{const s2=Math.sin(Math.PI*b/2);sx=s2*.25;lf=[-.35+s2*.1,0];rf=[.35+s2*.1,0];lh=[-1.2,-.7+s2*.4];rh=[1.2,-.7-s2*.4];break}
    case'kick':{const l=bi%2===0;lift=sn*.1;if(l)lf=[-.25-sn*.6,sn*.45];else rf=[.25+sn*.6,sn*.45];lh=[-1.2,-.2];rh=[1.2,-.2];break}
    case'twist':sx=sw*.18;lf=[-.35+sw*.2,0];rf=[.35+sw*.2,0];lh=[-1.3,-sw*.4];rh=[1.3,sw*.4];break;
  }
  if(d.state==='leave'){const w=Math.sin(performance.now()/80);lf=[-.25+w*.2,Math.max(0,w)*.2];rf=[.25-w*.2,Math.max(0,-w)*.2]}
  const fy=d.y-d.jz,bx=d.x+sx*R,by=fy-L-lift*R-R*.8;d.bodyY=by;
  const acc=d.accent,s=cell*2*(1+acc*.12);
  ctx.strokeStyle=INK;ctx.lineWidth=Math.max(1.1,cell*.055);ctx.lineCap='round';
  if(d.legT>.05){
    for(const[ft,side]of[[lf,-1],[rf,1]]){const hx=bx+side*R*.25,hy=by+R*.6,fx=d.x+ft[0]*R,ffy=fy-ft[1]*R;
      ctx.beginPath();ctx.moveTo(hx,hy);ctx.quadraticCurveTo((hx+fx)/2+side*R*.2,(hy+ffy)/2,fx,ffy);ctx.lineTo(fx+side*R*.22,ffy);ctx.stroke()}
    for(const[h,side]of[[lh,-1],[rh,1]]){ctx.beginPath();ctx.moveTo(bx+side*R*.55,by);ctx.quadraticCurveTo(bx+side*R*.95,by+h[1]*R*.2,bx+h[0]*R,by+h[1]*R);ctx.stroke()}
  }
  drawWash(d.wash,bx-s*.68,by-s*.68,s*1.36,s*1.36*(1-acc*.08));ctx.imageSmoothingEnabled=true;
  ctx.drawImage(d.frames[boil],bx-s/2,by-s/2,s,s*(1-acc*.08));
  ctx.fillStyle=INK;const ex=R*.28;ctx.beginPath();ctx.arc(bx-ex,by+R*.12,Math.max(1.2,cell*.05),0,TAU);ctx.arc(bx+ex,by+R*.12,Math.max(1.2,cell*.05),0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,120,170,.55)';ctx.beginPath();ctx.ellipse(bx-ex*1.7,by+R*.3,cell*.09,cell*.05,0,0,TAU);ctx.ellipse(bx+ex*1.7,by+R*.3,cell*.09,cell*.05,0,0,TAU);ctx.fill();
  ctx.strokeStyle=INK;ctx.beginPath();if(acc>.4){ctx.arc(bx,by+R*.32,cell*.06,0,TAU)}else{ctx.arc(bx,by+R*.24,cell*.08,.3,Math.PI-.3)}ctx.stroke();
}
function draw(now,dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cardW,cardH);
  const sig=cells.map(c=>c.state==='dot'&&!c.soil?0:1).join('');if(sig!==dirtSig){dirtSig=sig;renderDirt()}
  ctx.drawImage(panelCan,0,0,cardW,cardH);
  ctx.drawImage(fillCan,0,0,cardW,cardH);
  if(!holeCan)holeCan=document.createElement('canvas');
  if(holeCan.width!==cv.width||holeCan.height!==cv.height){holeCan.width=cv.width;holeCan.height=cv.height}
  {const h=holeCan.getContext('2d');h.setTransform(1,0,0,1,0,0);h.globalCompositeOperation='copy';h.drawImage(dirtCan,0,0);
    h.globalCompositeOperation='destination-out';h.setTransform(dpr,0,0,dpr,0,0);
    const punch=(m,x,y,sz)=>{if(m)h.drawImage(m,x-sz/2,y-sz/2,sz,sz)};
    for(const c of cells){if(c.state!=='grown'||c.away)continue;punch(getMask(c),cx(c),cy(c)-Math.abs(Math.sin((1-c.bounce)*Math.PI*3))*c.bounce*cell*.45,SZ/dpr*easeOutBack(c.growT)*(1+c.hit*.22)*1.16)}
    for(const a of accents)punch(a.mask,a.x,a.y,cell*1.3*a.s);
    for(const f of flyers)punch(f.mask,f.x,f.y,SZ/dpr*1.1);
    for(const d of dancers)if(d.bodyY!=null)punch(d.mask,d.x,d.bodyY,cell*2);
    ctx.drawImage(holeCan,0,0,cardW,cardH)}
  for(const a of accents){const s=cell*1.3*a.s,ws=cell*1.6*a.s;drawWash(a.wash,a.x-ws/2,a.y-ws/2,ws,ws);ctx.imageSmoothingEnabled=true;ctx.drawImage(a.frames[(Math.floor(now*8)+a.seed)%3],a.x-s/2,a.y-s/2,s,s)}
  // music-box score furniture: beat numbers, bar line, note names, band labels
  const small=Math.max(9,cell*.38);ctx.font=`500 ${small}px "Plus Jakarta Sans",system-ui,sans-serif`;ctx.textBaseline='middle';ctx.textAlign='center';
  ctx.textAlign='right';ctx.textBaseline='alphabetic';for(let r=0;r<ROWS;r++){const m=penta(r),nm=['C','','D','','E','','','G','','A','',''][m%12]+(m%12===0?String(Math.floor(m/12)-1):'');ctx.fillStyle=m%12===0?INK:'#6b66cf';ctx.fillText(nm,gx-cell*1.02,rowMid(r,gx)-cell*.2)}
  const boil=REDUCE?0:Math.floor(now*8)%3;
  let ph=-1,B=now*bpm/60;
  if(started&&playing){const lat=AC.outputLatency||AC.baseLatency||0,el=AC.currentTime-startTime-lat;ph=((Math.floor(el/stepDur)%COLS)+COLS)%COLS;B=el/spb;const due=AC.currentTime-lat;for(let k=evq.length-1;k>=0;k--)if(evq[k].t<=due){evq[k].fn();evq.splice(k,1)}}
  if(ph>=0){roundRect(ctx,gx+ph*cell+cell*.06,gy-cell*.15,cell*.88,gridH+cell*.3,cell*.3);ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgba(168,190,255,.42)';ctx.fill();ctx.globalCompositeOperation='source-over'}
  for(const c of cells){
    const x=cx(c),y=cy(c),onPh=c.col===ph;
    c.hit*=Math.exp(-dt*6);c.wig*=Math.exp(-dt*5);
    if(c.state==='dot'){if(c!==hoverCell)continue;const sx=x+Math.sin(now*40)*c.wig*2,sy=y+cell*.27,k=(onPh?1.55:1)*(1+c.wig*.6);ctx.fillStyle=DIRT_LINE;ctx.beginPath();ctx.ellipse(sx,sy,cell*.065*k,cell*.04*k,(c.seed%10)/10*1.2-.6,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,240,225,.7)';ctx.beginPath();ctx.arc(sx-cell*.02*k,sy-cell*.012*k,cell*.013*k,0,TAU);ctx.fill();continue}
    if(c.state==='stub'){ctx.strokeStyle='#a77b5c';ctx.lineWidth=Math.max(1,cell*.04);ctx.beginPath();ctx.arc(x,y+cell*.2,cell*.08,Math.PI,TAU);ctx.stroke();continue}
    c.spin*=Math.exp(-dt*2.2);c.bounce*=Math.exp(-dt*3);
    if(c.away){ctx.strokeStyle=INK_L;ctx.lineWidth=1;ctx.setLineDash([1,3]);ctx.beginPath();ctx.arc(x,y,cell*.26,0,TAU);ctx.stroke();ctx.setLineDash([]);continue}
    if(c.growT<1){c.growT=Math.min(1,c.growT+dt*3.2);if(c.growT>=1)ticks(x,y,5,cell*.5,COL[c.type][0])}
    const F=getFrames(c)[(boil+c.seed)%3],sc=easeOutBack(c.growT)*(1+c.hit*.22)*1.16,sz=SZ/dpr*sc;
    const wy=(onPh&&!c.awake?-cell*.07:0)+Math.sin(now*30)*c.wig*cell*.06-Math.abs(Math.sin((1-c.bounce)*Math.PI*3))*c.bounce*cell*.45;
    const WS=getWash(c),ws=cell*1.5*sc/1.16,rot=c.spin>.01?(1-c.spin)*TAU:0,sq=1+Math.sin(c.bounce*9)*c.bounce*.15;
    if(c.growT<1){ctx.save();ctx.beginPath();ctx.rect(x-cell*1.5,y+cell*.7-cell*1.5*c.growT,cell*3,cell*3);ctx.clip()}
    ctx.save();ctx.translate(x,y+wy);if(rot)ctx.rotate(rot);if(sq!==1)ctx.scale(sq,2-sq);
    if(c.awake){ctx.globalAlpha=.28+c.hit*.3;const hs=ws*(1.35+c.hit*.25);drawWash(WS,-hs/2,-hs/2,hs,hs);ctx.globalAlpha=1}
    drawWash(WS,-ws/2,-ws/2,ws,ws);
    ctx.drawImage(F,-sz/2,-sz/2,sz,sz);
    ctx.restore();
    if(c.growT<1)ctx.restore();
  }
  // bee + dotted flight trail
  ctx.fillStyle=INK;for(const p of bee.trail){ctx.globalAlpha=Math.min(1,p.life)*.6;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.8,cell*.03),0,TAU);ctx.fill()}ctx.globalAlpha=1;
  if(bee.state!=='wait'||bee.x>0){if(!bee.frames)bee.frames=framesFor('bee',bee.seed);const s=SZ/dpr*.85;if(!bee.wash)bee.wash=makeWash('bee',bee.seed);drawWash(bee.wash,bee.x-s*.6,bee.y-s*.6,s*1.2,s*1.2);ctx.imageSmoothingEnabled=true;ctx.drawImage(bee.frames[(Math.floor(now*14))%3],bee.x-s/2,bee.y-s/2,s,s)}
  // flyers + rain
  for(const f of flyers){const s2=SZ/dpr*1.1;ctx.save();ctx.translate(f.x,f.y+Math.sin(f.t*10)*cell*.04);ctx.globalAlpha=Math.max(0,f.fade);ctx.scale(f.flip,1);
    drawWash(f.wash,-s2*.68,-s2*.68,s2*1.36,s2*1.36);ctx.imageSmoothingEnabled=true;
    ctx.drawImage(f.frames[Math.floor(f.t*f.flap)%3],-s2/2,-s2/2,s2,s2);ctx.restore()}
  ctx.strokeStyle='#5f8fe0';ctx.lineWidth=Math.max(1.2,cell*.06);ctx.lineCap='round';for(const d of drops){ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-cell*.04,d.y+cell*.28);ctx.stroke()}
  // dance lane
  [...dancers].sort((a,b)=>a.x-b.x).forEach(d=>drawDancer(d,B,boil));
  // ink ticks
  ctx.strokeStyle=INK;ctx.lineWidth=Math.max(1,cell*.045);ctx.lineCap='round';
  for(const p of parts){if(p.kind==='petal'){ctx.globalAlpha=Math.min(1,p.life/p.max*1.5);ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.ellipse(0,0,cell*.11,cell*.06,0,0,TAU);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=.8;ctx.globalAlpha*=.5;ctx.stroke();ctx.restore();continue}
    if(p.kind==='dot'){ctx.globalAlpha=Math.min(1,p.life/p.max)*.7;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.9,cell*.035),0,TAU);ctx.fill();continue}
    ctx.strokeStyle=p.col||INK;const t=1-p.life/p.max,r1=p.r*(.55+t*.5),r2=r1+p.r*.25*(1-t);ctx.globalAlpha=1-t*.6;ctx.beginPath();ctx.moveTo(p.x+Math.cos(p.a)*r1,p.y+Math.sin(p.a)*r1);ctx.lineTo(p.x+Math.cos(p.a)*r2,p.y+Math.sin(p.a)*r2);ctx.stroke()}
  ctx.globalAlpha=1;
}

// ======================================================================
//  loop
// ======================================================================
let last=0;
function frame(ms){
  const now=ms/1000,dt=Math.min(.05,now-(last||now));last=now;
  if(loadT<SWEEP+SETTLE+.1){loadT+=dt;dirtSig=''}
  while(growQ.length&&loadT>=xDelay(gx+(growQ[0].col+.5)*cell)+POP)growNext(); // a column's icons pop in just after its dirt lands
  for(const d of dancers){
    d.accent*=Math.exp(-dt*7);d.vz-=cell*40*dt;d.jz=Math.max(0,d.jz+d.vz*dt);if(d.jz===0)d.vz=0;
    if(d.state==='fall'){d.vy+=cell*40*dt;d.y+=d.vy*dt;d.x=clamp(d.x+d.vx*dt,gx+cell,cardW-gx-cell);if(d.y>=groundY&&d.vy>0){d.y=groundY;d.state='pop';d.t=0;ticks(d.x,groundY-cell*.4,6,cell*.6)}}
    else if(d.state==='pop'){d.t+=dt;d.legT=easeOutBack(Math.min(1,d.t/.35));if(d.t>.35){d.state='dance';d.legT=1}}
    else if(d.state==='dance'){if((d.wt-=dt)<=0){d.wt=rnd(2,5);d.wvx=rnd(-1,1)*cell*.5}d.x+=d.wvx*dt;if(d.x<gx+cell||d.x>cardW-gx-cell){d.wvx*=-1;d.x=clamp(d.x,gx+cell,cardW-gx-cell)}}
    else if(d.state==='leave'){d.dir=d.dir||(d.x<cardW/2?-1:1);d.x+=d.dir*cell*2*dt}
  }
  dancers=dancers.filter(d=>d.state!=='leave'||(d.x>-cell*2&&d.x<cardW+cell*2));
  for(const p of parts){p.life-=dt;if(p.kind){p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.kind==='petal'){p.vy+=cell*3.5*dt;p.rot+=dt*5;p.vx*=.98}else{p.vx*=.96;p.vy*=.96}}}parts=parts.filter(p=>p.life>0);
  updateFlyers(dt);
  updateBee(dt,now);
  draw(now,dt);
  requestAnimationFrame(frame);
}
if(!restore())newSong((Math.random()*1e6)|0);
if(!REDUCE)loadT=0;
syncPlayer();
layout();
if(document.fonts){document.fonts.load('800 20px "Plus Jakarta Sans"');document.fonts.load('500 14px "Plus Jakarta Sans"')}
requestAnimationFrame(frame);
</script>
</body>
